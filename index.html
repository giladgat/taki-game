  body[data-bg="inferno"] #msg, body[data-bg="inferno"] small, body[data-bg="inferno"] .xp, body[data-bg="inferno"] h1 { text-shadow:0 1px 5px #000c; }
  @media (prefers-reduced-motion: reduce) { body[data-bg="inferno"]::before { animation:none; } }
  :root { color-scheme:dark; }
  #app { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:14px; max-width:100%; }
  h1 { position:relative; z-index:2; margin:0; font-size:28px; }
  @media (max-width:520px) { h1 { margin-top:34px; } }  /* leave room for the win counter in the corner */
  #bgbtn { position:absolute; z-index:5; left:calc(env(safe-area-inset-left, 0px) + 46px); bottom:calc(env(safe-area-inset-bottom, 0px) + 46px);
           font-size:24px; padding:10px 34px; min-width:150px; }
  #bgpicker { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:#000b; padding:16px; }
  #bgpicker[hidden] { display:none; }
  .bgp-panel { width:min(92vw, 440px); max-height:92vh; overflow:auto; display:flex; flex-direction:column; align-items:center; gap:14px; padding:18px;
        border-radius:14px; background:#fbf8ef; color:#1b1b1b; box-shadow:0 10px 40px #000c, inset 0 0 0 1px #0002; }
  .bgp-panel h3 { margin:0; font-size:22px; }
  .bgp-grid { width:100%; display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .bgp-opt { display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px; border:3px solid transparent; border-radius:12px;
        background:transparent; color:#1b1b1b; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
  .bgp-opt:hover { background:#0000000d; }
  .bgp-opt.on { border-color:#f59e0b; background:#fde04755; }
  .bgp-thumb { width:100%; aspect-ratio:3/4; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:34px;
        box-shadow:0 2px 6px #0006; }
  .xp { display:flex; gap:8px; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  .xp span { width:120px; height:8px; border-radius:99px; background:#0007; overflow:hidden; display:inline-block; }
  .xp b { display:block; height:100%; background:linear-gradient(90deg, #fde047, #f59e0b); }
  .result { font-size:15px; font-weight:700; color:#fde047; }
  /* Buttons share the card look: cream edge, glossy coloured panel, graffiti lettering. */
  .gb { position:relative; isolation:isolate; overflow:hidden; display:inline-flex; align-items:center; justify-content:center;
        border:0; border-radius:9px; padding:9px 16px; background:#fbf8ef; color:#fff; cursor:pointer;
        font-family:"Permanent Marker", Impact, "Marker Felt", cursive; font-size:19px; line-height:1.2; letter-spacing:.5px;
        -webkit-text-stroke:1.5px #111; paint-order:stroke fill; text-shadow:2px 2px 0 #111;
        box-shadow:0 1px 1px #0006, 0 4px 8px #0007, inset 0 0 0 1px #0002;
        transform:rotate(-2deg); transition:transform .15s ease, box-shadow .15s ease; }
  .gb::before { content:""; position:absolute; z-index:-1; inset:3px; border-radius:6px; background:var(--c); }
  .gb::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
        background:linear-gradient(115deg, #ffffff88 0%, #ffffff22 45%, #ffffff00 100%); }
  .gb:hover { background:#fbf8ef; transform:rotate(-2deg) translateY(-2px); }
  .gb:active { transform:rotate(-2deg) translateY(1px); box-shadow:0 1px 2px #000a; }
  .gb.red { --c:#ff5c5c; } .gb.blue { --c:#52a2ff; } .gb.green { --c:#40e070; } .gb.yellow { --c:#ffd926; }
  .gb.big { font-size:22px; padding:12px 26px; }
  .gb select { appearance:none; -webkit-appearance:none; position:relative; z-index:1; border:0; background:transparent; color:inherit;
        font:inherit; letter-spacing:inherit; -webkit-text-stroke:inherit; text-shadow:inherit; text-align:center; text-align-last:center;
        padding:0 14px; cursor:pointer; outline:none; }
  .gb select option { color:#111; -webkit-text-stroke:0; text-shadow:none; font-family:system-ui, sans-serif; }
  .gb .arr { position:absolute; left:8px; top:50%; translate:0 -50%; z-index:1; font-style:normal; font-size:12px; pointer-events:none; }
  #wins, #streak { position:absolute; z-index:5; top:calc(env(safe-area-inset-top, 0px) + 46px); right:calc(env(safe-area-inset-right, 0px) + 50px);
          padding:4px 12px; border:2px solid #fde047; border-radius:999px; background:#0009; font-size:16px; font-weight:700; direction:ltr; }
  #streak { right:auto; left:calc(env(safe-area-inset-left, 0px) + 50px); border-color:#fb923c; }
  #msg { font-size:20px; font-weight:600; min-height:28px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:900px; }
  .mid { display:flex; gap:clamp(12px,5vw,28px); align-items:center; justify-content:center; margin:6px 0; }
  /* Cards: cream card stock, a glossy coloured panel, a white oval with the symbol and corner indices. */
  .card { position:relative; transition:transform .2s ease; width:clamp(60px,18.5vw,90px); aspect-ratio:62/90; flex:none; border-radius:9px;
          background:#fbf8ef; color:var(--c, #fff); font-size:clamp(30px,10vw,44px); overflow:hidden; isolation:isolate; user-select:none;
          font-family:"Permanent Marker", Impact, "Marker Felt", cursive; transform:rotate(-4deg);
          box-shadow:0 1px 1px #0006, 0 5px 10px #0007, inset 0 0 0 1px #0002; }
  .card::before { content:""; position:absolute; z-index:-1; inset:4.5%; border-radius:6px; background:var(--panel, var(--c)); }
  .card::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
          background:linear-gradient(115deg, #ffffff88 0%, #ffffff22 45%, #ffffff00 100%); }
  .card .face { position:absolute; left:50%; top:50%; width:76%; height:58%; translate:-50% -50%; rotate:-22deg; border-radius:50%;
          background:#fffdf7; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1.5px #0002, 0 1px 3px #0006; }
  .card .face b { rotate:22deg; font-weight:400; line-height:1; -webkit-text-stroke:1.5px #111; paint-order:stroke fill; }
  .card .face b.long { font-size:.5em; }
  .card .ix { position:absolute; z-index:1; top:7%; left:10%; font-style:normal; font-size:.36em; line-height:1; color:#fff; text-shadow:0 1px 1px #000a; }
  .card .ix.b { top:auto; left:auto; bottom:7%; right:10%; rotate:180deg; }

  .pile { cursor:pointer; }
  select { font:inherit; padding:8px 12px; border:0; border-radius:8px; background:#2a3f6b; color:#fff; }
  input { font:inherit; width:110px; padding:8px 12px; border:0; border-radius:8px; text-align:center; direction:ltr; }

</style>
</head>
<body>

  <h1>טאקי שאיתי יצר</h1>
  <div id="wins" title="ניצחונות"></div>
  <div id="streak" title="רצף ניצחונות"></div>
  <div id="bgpicker" hidden></div>
  <button id="bgbtn" class="gb red" onclick="openBgPicker()" aria-label="החלף רקע">🎨 רקע</button>
  <div id="app"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const COL = { r:'#ff5c5c', y:'#ffd926', g:'#40e070', b:'#52a2ff' };
const NAMES = { r:'אדום', y:'צהוב', g:'ירוק', b:'כחול' };
const SYM = { stop:'✋', plus:'+', dir:'⇄', p2:'+2', col:'🌈', taki:'טאקי' };
const RAINBOW = 'conic-gradient(#ff5c5c,#ffd926,#40e070,#52a2ff,#ff5c5c)';
let pile = [], penalty = 0, flyFrom, deck, hands, pileTop, color, turn, taki, over, pick, msg;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

function fullDeck() {
  const d = [];
  for (const c of 'rygb') {
    for (let v = 1; v <= 9; v++) if (v !== 2) d.push({ c, v: '' + v }, { c, v: '' + v });
    for (const v of ['stop', 'plus', 'dir', 'p2', 'taki']) d.push({ c, v }, { c, v });
  }
  for (let i = 0; i < 4; i++) d.push({ c: 'w', v: 'col' });
  return shuffle(d);
}

function draw(w, n = 1) {
  for (let k = 0; k < n; k++) { if (!deck.length) deck = fullDeck(); hands[w].push(deck.pop()); }
}

// While a TAKI is open only cards of the current color may be played.
// While a +2 is pending, the player must stack another +2 or take the cards.
const canPlay = c => penalty ? c.v === 'p2' : taki ? c.c === color : c.c === 'w' || c.c === color || c.v === pileTop.v;

// Sounds are synthesized with Web Audio, so there are no audio files to load.
let AC, muted = false;
try { muted = localStorage.getItem('mute') === '1'; } catch (e) {}
// iOS keeps Web Audio silent until a tap unlocks it, and mutes it when the ringer switch is off,
// unless the audio session is set to "playback".
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state !== 'running') AC.resume();
  const b = AC.createBufferSource();
  b.buffer = AC.createBuffer(1, 1, 22050);
  b.connect(AC.destination);
  b.start(0);
}
['touchend', 'pointerup', 'click'].forEach(e => document.addEventListener(e, unlockAudio, { passive: true }));

function tone(f, t = 0, d = .12, type = 'sine', v = .15, f2) {
  if (muted) return;
  unlockAudio();
  const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + t;
  o.type = type;
  o.frequency.setValueAtTime(f, s);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
  g.gain.setValueAtTime(v, s);
  g.gain.exponentialRampToValueAtTime(.001, s + d);
  o.connect(g).connect(AC.destination);
  o.start(s); o.stop(s + d);
}
const SFX = {
  play:    () => tone(520, 0, .1, 'triangle', .22, 240),
  special: () => { tone(600, 0, .1, 'sawtooth', .09); tone(900, .09, .16, 'sawtooth', .09); },
  draw:    () => { tone(300, 0, .08, 'square', .07); tone(400, .08, .08, 'square', .07); },
  color:   () => [660, 880].forEach((f, i) => tone(f, i * .08, .12, 'sine', .15)),
  win:     () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .13, .3, 'triangle', .2)),
  lose:    () => [392, 330, 262].forEach((f, i) => tone(f, i * .2, .35, 'sawtooth', .09)),
};
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('mute', muted ? '1' : '0'); } catch (e) {}
  render();
}

// Mode 1 = against the computer, 2 = two players sharing one phone.
// `viewer` is whose hand is shown at the bottom; between turns in mode 2 a cover hides the hands.
let mode = '1', viewer = 'h', cover = false;
try { mode = localStorage.getItem('mode') || '1'; } catch (e) {}
const PN = p => p === 'h' ? 'שחקן 1' : 'שחקן 2';
const TL = () => mode !== '1' ? 'תור ' + PN(turn) : turn === 'h' ? 'התור שלך' : 'התור של המחשב';
const canAct = () => !over && !pick && !cover && turn === viewer;
function setMode(v) { netReset(); mode = v; try { localStorage.setItem('mode', v); } catch (e) {} newGame(); }

// Progress is kept on this device: wins, win streak, XP / level and achievements.
// Shared-phone games (mode 2) have no single player, so they aren't recorded.
let st = { games: 0, wins: 0, losses: 0, streak: 0, best: 0, xp: 0, ach: {} };
try { Object.assign(st, JSON.parse(localStorage.getItem('taki-stats')) || { wins: +localStorage.getItem('wins') || 0 }); } catch (e) {}
let game = { chain: 0, maxPen: 0 }, result = null;
const save = () => { try { localStorage.setItem('taki-stats', JSON.stringify(st)); } catch (e) {} };
const lvlOf = xp => Math.floor(Math.sqrt(xp / 100)) + 1;       // level n starts at 100 * (n - 1)^2 XP
const unlock = id => !st.ach[id] && (st.ach[id] = 1);

function showWins(bump) {
  const el = document.getElementById('wins');
  const fire = document.getElementById('streak');
  el.textContent = '🏆 ' + st.wins;
  fire.textContent = '🔥 ' + st.streak;
  if (bump) (st.streak ? fire : el).animate?.([{ scale: 1 }, { scale: 1.5 }, { scale: 1 }], { duration: 700 });
}

function toast(text) {
  const t = document.createElement('div');
  t.textContent = text;
  t.style.cssText = 'position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);translate:-50% 0;padding:10px 18px;' +
    'border-radius:999px;background:#111d;border:2px solid #fde047;color:#fff;font-weight:700;pointer-events:none;white-space:nowrap';
  document.body.appendChild(t);
  const a = t.animate([{ opacity: 0, translate: '-50% -20px' }, { opacity: 1, translate: '-50% 0', offset: .12 }, { opacity: 1, offset: .85 }, { opacity: 0 }],
    { duration: 2400 });
  a.onfinish = () => t.remove();
  SFX.color();
}

function record(win, oppLeft) {
  const before = lvlOf(st.xp);
  st.games++;
  if (win) { st.wins++; st.streak++; st.best = Math.max(st.best, st.streak); } else { st.losses++; st.streak = 0; }
  const gain = win ? 100 + Math.min(st.streak, 5) * 20 + (mode === '1' ? { 1: 0, 2: 10, 3: 30 }[level] : 20) : 30;
  st.xp += gain;
  const got = [], u = (id, name) => unlock(id) && got.push(name);
  if (win) {
    u('first', 'ניצחון ראשון');
    if (st.streak >= 3) u('s3', '3 ניצחונות ברצף');
    if (st.streak >= 5) u('s5', '5 ניצחונות ברצף');
    if (st.wins >= 10) u('w10', '10 ניצחונות');
    if (mode === '1' && level === '3') u('hard', 'ניצחון על המחשב הקשה');
    if (oppLeft >= 7) u('crush', 'ניצחון מוחץ');
    if (game.maxPen >= 6) u('stack', 'ערימת +2 ענקית');
  }
  save();
  const lv = lvlOf(st.xp);
  result = { win, gain, up: lv > before, lv };
  showWins(true);
  if (result.up) setTimeout(() => toast('⬆️ עלית לרמה ' + lv), 500);
  got.forEach((n, i) => setTimeout(() => toast('🏅 הישג חדש: ' + n), 500 + (result.up ? 2000 : 0) + i * 2000));
}

// Mode 3 (two phones): the host runs the game; the guest sends its moves and receives its own view of the state.
let net = {}, winnerW = '', moveN = 0, lastN = 0;
const guest = () => mode === '3' && net.role === 'guest';
function netReset() {
  try { net.peer && net.peer.destroy(); } catch (e) {}
  net = { role: '', ready: false, code: '', status: '', conn: null, peer: null };
}
netReset();
function lost() { netReset(); net.status = 'החיבור נותק'; render(); }
const view = () => ({ mine: hands.c, opp: hands.h.length, top: pileTop, color, turn, taki, over, pick, msg, n: moveN, win: winnerW, penalty, pile });

function hostGame() {
  if (typeof Peer === 'undefined') { net.status = 'אין חיבור לשרת, בדוק אינטרנט'; return render(); }
  netReset(); net.role = 'host'; net.code = '' + (1000 + Math.random() * 9000 | 0); net.status = 'ממתין לשחקן השני…';
  const p = net.peer = new Peer('taki-' + net.code);
  p.on('error', e => { if (e.type === 'unavailable-id') return hostGame(); netReset(); net.status = 'שגיאת חיבור'; render(); });
  p.on('connection', c => {
    if (net.conn) return c.close();
    net.conn = c;
    c.on('open', () => { net.ready = true; newGame(); });
    c.on('data', onData);
    c.on('close', lost);
  });
  render();
}

function joinGame() {
  const code = document.getElementById('code').value.trim();
  if (typeof Peer === 'undefined' || !code) { net.status = code ? 'אין חיבור לשרת, בדוק אינטרנט' : 'הקלד קוד'; return render(); }
  netReset(); net.role = 'guest'; net.status = 'מתחבר…';
  const p = net.peer = new Peer();
  p.on('error', () => { netReset(); net.status = 'לא נמצא משחק עם הקוד הזה'; render(); });
  p.on('open', () => {
    const c = net.conn = p.connect('taki-' + code);
    c.on('data', applyView);
    c.on('close', lost);
  });
  render();
}

// Host: a move arrives from the guest (player 'c').
function onData(d) {
  if (d.t === 'new') return newGame();
  if (turn !== 'c' || over) return;
  if (d.t === 'click' && !pick && hands.c[d.i] && canPlay(hands.c[d.i])) play('c', d.i);
  else if (d.t === 'draw' && !pick && !taki) takeCards('c');
  else if (d.t === 'close' && taki && !pick) closeTaki();
  else if (d.t === 'color' && pick) setColor(d.c);
}

// Guest: the host sent the current state.
function applyView(v) {
  const was = over;
  if (!v.n) noAnim = true;
  else if (hands && v.n !== lastN && !flyFrom) {
    const el = document.querySelectorAll('.card.cpu')[hands.h.length >> 1];
    if (el) flyFrom = { rect: el.getBoundingClientRect(), card: v.top };
  }
  hands = { h: Array.from({ length: v.opp }, () => ({})), c: v.mine };
  pileTop = v.top; color = v.color; turn = v.turn; taki = v.taki; over = v.over; pick = v.pick; msg = v.msg; penalty = v.penalty; game.maxPen = v.n ? Math.max(game.maxPen, v.penalty) : 0; pile = v.pile || []; viewer = 'c';
  net.ready = true;
  if (v.n && v.n !== lastN) /^\d$/.test(v.top.v) ? SFX.play() : SFX.special();
  lastN = v.n;
  if (v.over && !was) { record(v.win === 'c', hands.h.length); confetti(); v.win === 'c' ? SFX.win() : SFX.lose(); }
  render();
}

function lobby() {
  const st = net.status ? `<div>${net.status}</div>` : '';
  if (net.role === 'host') return `<div id="msg">הקוד שלך: <span style="font-size:44px;letter-spacing:6px">${net.code}</span></div>${st}<small>הקלד את הקוד בטלפון השני</small>`;
  if (net.role === 'guest') return `<div id="msg">${net.status}</div>`;
  return `<div id="msg">משחק בין שני טלפונים</div>${st}
    <button class="gb blue" onclick="hostGame()">פתח משחק חדש</button>
    <div class="row"><input id="code" inputmode="numeric" maxlength="4" placeholder="קוד"><button class="gb green" onclick="joinGame()">הצטרף</button></div>`;
}

const controls = () => `<div class="row"><button class="gb red" onclick="newGame()">משחק חדש</button>
      <span class="gb blue"><select onchange="setMode(this.value)" aria-label="מצב משחק">
        <option value="1" ${mode === '1' ? 'selected' : ''}>נגד המחשב</option>
        <option value="2" ${mode === '2' ? 'selected' : ''}>שני שחקנים, טלפון אחד</option>
        <option value="3" ${mode === '3' ? 'selected' : ''}>שני טלפונים</option></select><i class="arr">▾</i></span>
      ${mode === '1' ? `<span class="gb green"><select onchange="setLevel(this.value)" aria-label="רמת קושי">${[['1', 'קל'], ['2', 'בינוני'], ['3', 'קשה']].map(([v, t]) =>
        `<option value="${v}" ${v === level ? 'selected' : ''}>${t}</option>`).join('')}</select><i class="arr">▾</i></span>` : ''}
      <button class="gb yellow" onclick="toggleMute()" aria-label="צלילים">${muted ? '🔇' : '🔊'}</button></div>`;
function reveal() { viewer = turn; cover = false; render(); }

function newGame() {
  plays = 0;
  noAnim = true;
  if (guest()) return net.conn.send({ t: 'new' });
  moveN = 0; winnerW = ''; penalty = 0; pile = []; game = { chain: 0, maxPen: 0 }; result = null;
  deck = fullDeck(); hands = { h: [], c: [] };
  draw('h', 8); draw('c', 8);
  do { pileTop = deck.pop(); if (!/^\d$/.test(pileTop.v)) { deck.unshift(pileTop); pileTop = null; } } while (!pileTop);
  color = pileTop.c; turn = 'h'; taki = false; over = false; pick = false; cover = false; viewer = 'h'; msg = TL();
  render();
}

function next() {
  render();
  if (over) return;
  if (mode === '1' && turn === 'c') setTimeout(cpuTurn, 1300);
  if (mode === '2' && turn !== viewer && !cover) setTimeout(() => { if (!over && turn !== viewer) { cover = true; render(); } }, 1300);
}

function play(w, i) {
  moveN++;
  const src = w === viewer ? document.querySelector(`[data-h="${i}"]`)
    : document.querySelectorAll('.card.cpu')[hands.c.length >> 1];
  const c = hands[w].splice(i, 1)[0];
  if (src) flyFrom = { rect: src.getBoundingClientRect(), card: c };
  pile.push({ c: pileTop.c, v: pileTop.v, r: Math.round(Math.random() * 70 - 35), x: Math.round(Math.random() * 24 - 12), y: Math.round(Math.random() * 24 - 12) });
  pile = pile.slice(-20);
  pileTop = c;
  /^\d$/.test(c.v) ? SFX.play() : SFX.special();
  if (c.c !== 'w') color = c.c;
  if (c.v === 'taki') taki = true;
  if (taki && w === viewer && mode !== '2' && ++game.chain >= 5 && unlock('chain')) toast('🏅 הישג חדש: שרשרת טאקי של 5 קלפים'), save();
  if (!hands[w].length) { over = true; winnerW = w; if (mode === '1' || mode === '3') record(w === viewer, hands[w === 'h' ? 'c' : 'h'].length); msg = mode !== '1' ? '🎉 ' + PN(w) + ' ניצח!' : w === 'h' ? '🎉 ניצחת!' : '🤖 המחשב ניצח'; confetti(); mode === '2' || w === 'h' ? SFX.win() : SFX.lose(); return next(); }
  if (c.c === 'w') {
    if (w === viewer || mode === '3') { pick = true; msg = mode === '3' ? PN(w) + ' בוחר צבע' : 'בחר צבע'; return next(); }
    return setColor(level === '1' ? 'rygb'[Math.random() * 4 | 0] : mostCommon());
  }
  if (taki) { msg = mode !== '1' ? PN(w) + ' פתח טאקי' : w === viewer ? 'טאקי פתוח · קומבו ' + game.chain + ': שחק באותו צבע או סגור' : 'המחשב משחק טאקי…'; return next(); }
  endMove(w);
}

function setColor(c) { if (guest()) return net.conn.send({ t: 'color', c }); SFX.color(); color = c; pick = false; endMove(turn); }

// Stop / direction change / plus / +2 give the same player another turn (2 players).
function endMove(w) {
  const o = w === 'h' ? 'c' : 'h', v = pileTop.v;
  let note = '';
  if (v === 'p2') { penalty += 2; game.maxPen = Math.max(game.maxPen, penalty); turn = o; note = '+' + penalty + ': לקחת קלפים או להניח +2 · '; }
  else if (!['stop', 'dir', 'plus'].includes(v)) turn = o;
  else note = 'שחק שוב · ';
  msg = note + TL();
  next();
}

function closeTaki() { if (guest()) return net.conn.send({ t: 'close' }); taki = false; game.chain = 0; endMove(turn); }

function mostCommon() {
  const n = { r: 0, y: 0, g: 0, b: 0 };
  hands.c.forEach(c => { if (c.c !== 'w') n[c.c]++; });
  return Object.keys(n).sort((a, b) => n[b] - n[a])[0];
}

// Difficulty: 1 = easy, 2 = medium, 3 = hard.
let level = '2';
try { level = localStorage.getItem('level') || '2'; } catch (e) {}
function setLevel(v) { level = v; try { localStorage.setItem('level', v); } catch (e) {} }

function cpuTurn() {
  if (over || turn !== 'c') return;
  const h = hands.c;
  if (taki) {
    const i = h.findIndex(c => c.c === color);
    return i < 0 || (level === '1' && Math.random() < .5) ? closeTaki() : play('c', i);
  }
  const rank = { p2: 5, taki: 4, stop: 3, dir: 3, plus: 3, col: 0 };
  const ok = h.map((c, i) => i).filter(i => canPlay(h[i]));
  if (!ok.length || (level === '1' && Math.random() < .2)) return takeCards('c');
  const humanClose = hands.h.length <= 2;
  const score = i => {
    const c = h[i];
    if (level === '1') return Math.random();
    let r = rank[c.v] ?? 1;
    if (level === '3') {
      if (humanClose && ['stop', 'plus', 'dir', 'p2'].includes(c.v)) r += 6;   // keep control when you're close to winning
      if (c.c === 'w' && h.length > 2) r -= 3;                                 // save wild cards
      else r += h.filter(x => x.c === c.c).length * .3;                        // favor the color it holds most of
    }
    return r + Math.random() * (level === '3' ? .1 : 1);
  };
  play('c', ok.sort((a, b) => score(b) - score(a))[0]);
}

function humanClick(i) {
  if (guest()) {
    if (canAct() && canPlay(hands.c[i])) {
      const el = document.querySelector(`[data-h="${i}"]`);
      if (el) flyFrom = { rect: el.getBoundingClientRect(), card: hands.c[i] };
      net.conn.send({ t: 'click', i });
    }
    return;
  }
  if (!canAct() || !canPlay(hands[viewer][i])) return;
  play(viewer, i);
}

// Take the pending +2 penalty, or one card; the turn passes to the other player.
function takeCards(w) {
  const n = penalty || 1;
  SFX.draw(); draw(w, n); penalty = 0; turn = w === 'h' ? 'c' : 'h';
  msg = (mode !== '1' ? PN(w) : w === 'h' ? 'אתה' : 'המחשב') + ' לוקח ' + (n === 1 ? 'קלף' : n + ' קלפים') + ' · ' + TL();
  next();
}

function humanDraw() {
  if (guest()) { if (canAct() && !taki) net.conn.send({ t: 'draw' }); return; }
  if (!canAct() || taki) return;
  takeCards(viewer);
}

const cv = c => c.c === 'w' ? `--c:#1f2937;--panel:${RAINBOW}` : `--c:${COL[c.c]}`;
const inner = c => {
  const t = SYM[c.v] || c.v, ix = c.v === 'taki' ? 'ט' : t;
  return `<i class="ix">${ix}</i><i class="ix b">${ix}</i><span class="face"><b${t.length > 2 ? ' class="long"' : ''}>${t}</b></span>`;
};
const face = (c, extra = '', click = '') =>
  `<div class="card ${extra}" style="${cv(c)}" ${click}>${inner(c)}</div>`;

function render() {
  const app = document.getElementById('app');
  if (cover) {
    app.innerHTML = `<div id="msg" style="margin-top:20vh">העבר את הטלפון ל${PN(turn)}</div>
      <button onclick="reveal()" style="font-size:22px;padding:14px 28px">אני מוכן</button>`;
    return;
  }
  if (mode === '3' && !net.ready) { app.innerHTML = lobby() + controls(); return; }
  const prev = captureHand(), seen = {};
  const mine = canAct(), other = viewer === 'h' ? 'c' : 'h';
  app.innerHTML = `
    <div style="text-align:center">
      <div class="xp">רמה ${lvlOf(st.xp)}<span><b style="width:${Math.round(100 * (st.xp - 100 * (lvlOf(st.xp) - 1) ** 2) / (100 * (2 * lvlOf(st.xp) - 1)))}%"></b></span></div>
      <div id="msg">${msg}</div>
      ${over && result && mode !== '2' ? `<div class="result">${result.win ? '🎉' : '💪'} +${result.gain} XP${st.streak > 1 ? ' · 🔥 ' + st.streak + ' ברצף' : ''}${result.up ? ' · ⬆️ רמה ' + result.lv : ''}</div>` : ''}
      ${over ? '<button class="gb yellow big" onclick="newGame()">עוד משחק! ▶</button>' : ''}
      <small>${mode !== '1' ? 'קלפים ל' + PN(other) : 'קלפים למחשב'}: ${hands[other].length}</small>${mode === '3' ? `<br><small>אתה ${PN(viewer)}</small>` : ''}
    </div>
    <div class="row">${hands[other].map(() => '<div class="card back cpu"></div>').join('')}</div>
    <div class="mid">
      <div class="pile" onclick="humanDraw()" title="משוך קלף"><div class="card back">משוך${penalty ? '<br>' + penalty : ''}</div></div>
      <div class="stack">${pile.map(c => `<div class="card under" style="${cv(c)};transform:translate(${c.x}px,${c.y}px) rotate(${c.r}deg)">${inner(c)}</div>`).join('')}
        <div class="card top" style="${cv(pileTop)};box-shadow:0 0 0 4px ${COL[color]}, 0 6px 12px #000a">${inner(pileTop)}</div></div>
      <div style="text-align:center">צבע נוכחי<br><b style="color:${COL[color]}">${NAMES[color]}</b></div>
    </div>
    ${pick && turn === viewer ? `<div class="row pick">${Object.keys(COL).map(c =>
        `<button style="background:${COL[c]}" onclick="setColor('${c}')" title="${NAMES[c]}"></button>`).join('')}</div>` : ''}
    ${taki && mine ? '<button class="gb red" onclick="closeTaki()">סגור טאקי</button>' : ''}
    <div class="row">${hands[viewer].map((c, i) => {
        const k = c.c + c.v, n = seen[k] = (seen[k] || 0) + 1;
        return face(c, mine && canPlay(c) ? 'ok' : '', `data-h="${i}" data-k="${k}#${n}" onclick="humanClick(${i})"`);
      }).join('')}</div>
    ${controls()}`;
  if (mode === '3' && net.role === 'host' && net.ready && net.conn.open) net.conn.send(view());
  animateHand(prev);
  if (flyFrom) flyCard(flyFrom);
  flyFrom = null;
}

// Black-and-white confetti (paper squares, dots and curling streamers) fired from both bottom corners, with air drag, sway and 3D flipping.
function confetti() {
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) return;
  const cv = document.createElement('canvas'), g = cv.getContext?.('2d');
  if (!g) return;
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none';
  document.body.appendChild(cv);
  g.scale(dpr, dpr);
  const ps = [];
  const spawn = (x, y, ang, speed, delay) => {
    const a = ang + (Math.random() - .5) * .5, v = speed * (.45 + Math.random() * .55), r = Math.random();
    const type = r < .62 ? 0 : r < .82 ? 1 : 2, w = type === 2 ? 3.5 : 6 + Math.random() * 8;
    ps.push({ x, y, type, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w, h: type === 2 ? 40 + Math.random() * 35 : w * (1.3 + Math.random() * .9), rot: Math.random() * 6.28,
      vr: (Math.random() - .5) * .3, f: Math.random() * 6.28, vf: .12 + Math.random() * .22, sway: Math.random() * 6.28,
      dark: Math.random() < .5, delay });
  };
  const power = Math.min(62, Math.max(30, H / 13));
  for (let i = 0; i < 130; i++) {
    spawn(W * .04, H, -Math.PI * (.2 + Math.random() * .12), power, Math.random() * 120);      // left cannon, up and to the right
    spawn(W * .96, H, -Math.PI * (.68 + Math.random() * .12), power, Math.random() * 120);     // right cannon, up and to the left
  }
  for (let i = 0; i < 80; i++) spawn(Math.random() * W, -20, Math.PI / 2, 2, 700 + Math.random() * 900);   // a light shower after the blast
  const t0 = performance.now(); let last = t0;
  (function frame(now) {
    const dt = Math.min(2, (now - last) / 16.7); last = now;
    g.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of ps) {
      if (now - t0 < p.delay) { alive++; continue; }
      p.vx *= Math.pow(.93, dt);
      p.vy = p.vy * Math.pow(.93, dt) + .2 * dt;
      p.sway += .07 * dt; p.f += p.vf * dt; p.rot += p.vr * dt;
      p.x += (p.vx + Math.sin(p.sway) * .9) * dt; p.y += p.vy * dt;
      if (p.y > H + 30) continue;
      alive++;
      const flip = Math.cos(p.f);
      g.save();
      g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, flip);
      const col = p.dark ? (flip > 0 ? '#111' : '#3a3a3a') : (flip > 0 ? '#fff' : '#cfcfcf');
      g.fillStyle = g.strokeStyle = col;
      g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 3;
      if (p.type === 0) {
        g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else if (p.type === 1) {
        g.beginPath(); g.arc(0, 0, p.w * .42, 0, 6.283); g.fill();
      } else {                                    // streamer: a thin ribbon that waves as it falls
        g.lineWidth = p.w; g.lineCap = 'round'; g.beginPath();
        for (let k = 0; k <= 8; k++) {
          const yy = -p.h / 2 + p.h * k / 8, xx = Math.sin(k * .9 + p.f * 1.6) * 5;
          k ? g.lineTo(xx, yy) : g.moveTo(xx, yy);
        }
        g.stroke();
      }
      if (p.dark && p.type !== 2) { g.shadowBlur = 0; g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = .6; p.type ? g.stroke() : g.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      g.restore();
    }
    if (alive && now - t0 < 9000) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

// Slide the played card from its old position onto the discard pile.
function flyCard({ rect, card }) {
  const t = document.querySelector('.card.top'), r = t.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'card';
  f.innerHTML = inner(card);
  f.style.cssText = `position:fixed;z-index:9;pointer-events:none;transition:none;left:${r.left}px;top:${r.top}px;` +
    `width:${r.width}px;height:${r.height}px;${cv(card)};box-shadow:0 0 0 4px ${COL[color]}, 0 10px 20px #000a;font-size:clamp(42px,14vw,58px)`;
  document.body.appendChild(f);
  t.style.visibility = 'hidden';
  const dx = rect.left + rect.width / 2 - (r.left + r.width / 2), dy = rect.top + rect.height / 2 - (r.top + r.height / 2);
  f.animate([
    { translate: `${dx}px ${dy}px`, scale: rect.width / r.width, rotate: '14deg' },
    { translate: `${dx * .3}px ${dy * .3 - 24}px`, scale: 1.12, rotate: '-6deg', offset: .65 },
    { translate: '0 0', scale: 1, rotate: '0deg' }
  ], { duration: 900, easing: 'cubic-bezier(.3,.7,.3,1)' })
    .onfinish = () => { f.remove(); t.style.visibility = ''; if (++plays % 3 === 0) ripple(r); };
}

// A wave travels under the felt: a ring of raised cloth (light edge, shadowed edge) that sits below the cards. Nothing else moves.
function ripple(r) {
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) return;
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  // The clipping layer keeps the big rings from ever adding scroll width.
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none';
  document.body.appendChild(layer);
  let left = 1;
  for (let k = 0; k < 1; k++) {
    const w = document.createElement('div');
    w.style.cssText = `position:absolute;border-radius:50%;width:90px;height:90px;left:${x - 45}px;top:${y - 45}px;` +
      `background:radial-gradient(circle closest-side, transparent 46%, #ffffff40 56%, #ffffff12 61%, #00000055 69%, transparent 80%)`;
    layer.appendChild(w);
    w.animate([{ scale: .2, opacity: 1 }, { scale: 15, opacity: 0 }],
      { duration: 2800, delay: k * 380, easing: 'ease-out', fill: 'backwards' }).onfinish = () => { if (!--left) layer.remove(); };
  }
}

// Remaining hand cards slide to their new places; drawn cards slide in from the pile.
let noAnim = false, plays = 0;   // the wave only appears on every third card played
function captureHand() {
  const m = {};
  document.querySelectorAll('[data-k]').forEach(e => { m[e.dataset.k] = e.getBoundingClientRect(); });
  return m;
}
function animateHand(prev) {
  const skip = noAnim; noAnim = false;
  if (skip || !Object.keys(prev).length) return;
  const pile = document.querySelector('.pile .card').getBoundingClientRect();
  document.querySelectorAll('[data-k]').forEach(e => {
    const r = e.getBoundingClientRect(), o = prev[e.dataset.k];
    if (o && Math.abs(o.left - r.left) < 1 && Math.abs(o.top - r.top) < 1) return;
    const from = o || pile;
    e.animate([
      { translate: `${from.left - r.left}px ${from.top - r.top}px`, scale: o ? 1 : .5, opacity: o ? 1 : 0 },
      { translate: '0 0', scale: 1, opacity: 1 }
    ], { duration: o ? 600 : 750, easing: 'cubic-bezier(.3,.7,.3,1)' });
  });
}

// Background switcher. To add a background, append an entry here and style it as body[data-bg="id"].
const BACKGROUNDS = [
  { id: 'poker', name: 'שולחן פוקר', icon: '♠',
    thumb: 'radial-gradient(ellipse at 50% 40%, #3aa271, #176046) ; box-shadow:inset 0 0 0 7px #3a251a, 0 2px 6px #0006' },
  { id: 'sunset', name: 'שקיעה בים', icon: '🌴',
    thumb: 'radial-gradient(circle at 50% 58%, #fff4c4 0 7%, #ffd36b 8%, #ff8f4a00 38%), linear-gradient(#1b1040 0, #b23a7c 42%, #ffb86b 58%, #d9527a 60%, #6e2f88 80%, #1d1240 100%)' },
  { id: 'inferno', name: 'אש', icon: '🔥',
    thumb: 'linear-gradient(#ffb21e 0, #d61a0a 12%, #130303 38%, #130303 62%, #d61a0a 88%, #ffb21e 100%)' },
];
let bgIdx = 0;
try { bgIdx = Math.max(0, BACKGROUNDS.findIndex(b => b.id === localStorage.getItem('bg'))); } catch (e) {}
function applyBg() { document.body.setAttribute?.('data-bg', BACKGROUNDS[bgIdx].id); }
function openBgPicker() {
  const el = document.getElementById('bgpicker');
  el.hidden = false;
  el.onclick = e => { if (e.target === el) closeBgPicker(); };
  el.innerHTML = `<div class="bgp-panel"><h3>בחר רקע</h3><div class="bgp-grid">${BACKGROUNDS.map((b, i) =>
    `<button class="bgp-opt${i === bgIdx ? ' on' : ''}" onclick="pickBg(${i})"><span class="bgp-thumb" style="background:${b.thumb}">${b.icon}</span><span>${b.name}</span></button>`).join('')}</div>
    <button class="gb red" onclick="closeBgPicker()">סגור</button></div>`;
}
function closeBgPicker() { document.getElementById('bgpicker').hidden = true; }
function pickBg(i) {
  bgIdx = i;
  try { localStorage.setItem('bg', BACKGROUNDS[i].id); } catch (e) {}
  applyBg();
  closeBgPicker();
}
applyBg();

// On phones held upright, the page is laid out about 12% wider than the screen, so the whole game is seen a bit from afar.
function fitPhone() {
  const meta = document.querySelector('meta[name=viewport]');
  if (!meta || typeof matchMedia !== 'function') return;
  const small = Math.min(screen.width, screen.height);
  const far = matchMedia('(pointer: coarse)').matches && small < 600 && matchMedia('(orientation: portrait)').matches;
  meta.content = far ? 'width=' + Math.round(small / .88) + ', initial-scale=.88, viewport-fit=cover' : 'width=device-width, initial-scale=1, viewport-fit=cover';
}
fitPhone();
window.addEventListener?.('orientationchange', fitPhone);
window.addEventListener?.('resize', fitPhone);

showWins();
newGame();
</script>
